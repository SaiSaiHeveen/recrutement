<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Recrutement - Dashboard</title>
  <!-- Redirection immédiate si pas connecté (avant même l'affichage) -->
  <script>
    if (!sessionStorage.getItem("candid_admin_session")) window.location.replace("admin.html");
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="dashboard">

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand"><span class="logo">★</span><span data-site-name>Recrutement</span></a>
      <nav class="nav-links">
        <span class="hide-mobile" style="color:var(--muted);font-size:.9rem">Connecté : <strong id="admin-name" style="color:var(--text)"></strong></span>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Déconnexion</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <div class="page-head" style="text-align:left">
        <h1>Candidatures</h1>
        <p>Consulte, accepte ou refuse les candidatures reçues.</p>
      </div>

      <div id="dash-alert" class="alert hidden" role="alert"></div>

      <div class="stats">
        <div class="card stat"><div class="label">Total</div><div class="value" id="stat-total">0</div></div>
        <div class="card stat pending"><div class="label">En attente</div><div class="value" id="stat-pending">0</div></div>
        <div class="card stat accepted"><div class="label">Acceptées</div><div class="value" id="stat-accepted">0</div></div>
        <div class="card stat refused"><div class="label">Refusées</div><div class="value" id="stat-refused">0</div></div>
      </div>

      <div class="toolbar">
        <input type="search" id="search" class="search" placeholder="🔍 Rechercher un pseudo...">
        <select id="filter">
          <option value="all">Tous les statuts</option>
          <option value="en_attente">En attente</option>
          <option value="acceptee">Acceptées</option>
          <option value="refusee">Refusées</option>
        </select>
        <button id="refresh-btn" class="btn btn-ghost">↻ Actualiser</button>
      </div>

      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pseudo</th>
              <th>Poste</th>
              <th>Discord</th>
              <th>Date</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="candidatures-body">
            <tr><td colspan="6" class="empty">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal détail -->
  <div class="modal-backdrop hidden" id="detail-modal">
    <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="modal-close" aria-label="Fermer">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="container">© <span data-year></span> <span data-site-name>Recrutement</span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
